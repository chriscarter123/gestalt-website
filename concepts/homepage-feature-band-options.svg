<svg width="1800" height="1350" viewBox="0 0 1800 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1800" y2="1350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F5EE"/>
      <stop offset="1" stop-color="#F3F0E7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(310 210) rotate(31) scale(360 250)">
      <stop stop-color="#D4AF37" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1450 270) rotate(12) scale(390 300)">
      <stop stop-color="#14B860" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#14B860" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 1070) rotate(0) scale(440 260)">
      <stop stop-color="#214F94" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#214F94" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#111827" flood-opacity="0.10"/>
