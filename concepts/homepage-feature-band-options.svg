    <text x="682" y="530" class="sans small-strong">Delivery</text>
    <text x="682" y="580" class="sans tiny">Runs on guest</text>
    <text x="682" y="605" class="sans tiny">phones</text>
  </g>
  <text x="156" y="710" class="sans small">Premium, readable, and strongest for product positioning.</text>

