    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 74px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 28px; fill: #5B6472; }
      .card-label { font-size: 22px; font-weight: 700; fill: #B37A2A; letter-spacing: 0.08em; text-transform: uppercase; }
      .card-title { font-size: 44px; font-weight: 700; fill: #111827; }
      .body { font-size: 24px; fill: #647083; }
      .small { font-size: 22px; fill: #6B7280; }
      .small-strong { font-size: 22px; font-weight: 700; fill: #111827; }
      .tiny { font-size: 18px; fill: #8B93A1; }
      .white { fill: #FFFFFF; }
      .muted-light { fill: #D6DBE5; }
      .line { stroke: #E8E1D3; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1350" fill="url(#bg)"/>
  <rect width="1800" height="1350" fill="url(#glow1)"/>
  <rect width="1800" height="1350" fill="url(#glow2)"/>
  <rect width="1800" height="1350" fill="url(#glow3)"/>

