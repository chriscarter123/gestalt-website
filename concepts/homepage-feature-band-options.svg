  <path d="M1188 1065H1210" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <path d="M1417 1065H1439" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <path d="M1210 1065L1198 1057V1073L1210 1065Z" fill="#9CA3AF" transform="rotate(180 1204 1065)"/>
  <path d="M1439 1065L1427 1057V1073L1439 1065Z" fill="#9CA3AF" transform="rotate(180 1433 1065)"/>
  <text x="996" y="1174" class="sans small">Best if you want the section to explain the product flow.</text>
