  <g filter="url(#shadow)">
    <rect x="960" y="820" width="720" height="400" rx="34" fill="#FFFFFF" stroke="#EDE6D8" stroke-width="2"/>
  </g>
  <text x="996" y="868" class="sans card-label">Option 4</text>
  <text x="996" y="920" class="serif card-title">Workflow Cards</text>
  <g>
    <rect x="996" y="980" width="190" height="170" rx="26" fill="#FAF8F2" stroke="#E8E1D3" stroke-width="2"/>
    <text x="1022" y="1015" class="sans card-label">01</text>
    <text x="1022" y="1060" class="sans small-strong">Generate</text>
    <text x="1022" y="1100" class="sans tiny">Create audio</text>
    <text x="1022" y="1124" class="sans tiny">description drafts</text>
    <text x="1022" y="1148" class="sans tiny">from collection data.</text>
  </g>
  <g>
    <rect x="1225" y="980" width="190" height="170" rx="26" fill="#FAF8F2" stroke="#E8E1D3" stroke-width="2"/>
