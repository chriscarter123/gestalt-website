    <rect x="1454" y="980" width="190" height="170" rx="26" fill="#FAF8F2" stroke="#E8E1D3" stroke-width="2"/>
    <text x="1480" y="1015" class="sans card-label">03</text>
    <text x="1480" y="1060" class="sans small-strong">Deliver</text>
    <text x="1480" y="1100" class="sans tiny">Visitors access</text>
    <text x="1480" y="1124" class="sans tiny">content on their</text>
    <text x="1480" y="1148" class="sans tiny">own phones.</text>
