  <text x="1030" y="536" class="sans body muted-light">ADA scorecards</text>
  <text x="1030" y="576" class="sans body muted-light">Audit logs</text>
  <text x="1030" y="616" class="sans body muted-light">Grant-ready reports</text>
  <text x="1376" y="480" class="sans small-strong">For Visitors</text>
  <text x="1376" y="536" class="sans body">Audio descriptions</text>
  <text x="1376" y="576" class="sans body">Recognition</text>
  <text x="1376" y="616" class="sans body">Accessible wayfinding</text>
  <text x="996" y="710" class="sans small">Clear audience separation and faster story comprehension.</text>

