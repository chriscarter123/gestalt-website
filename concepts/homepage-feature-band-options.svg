  <g filter="url(#shadow)">
    <rect x="120" y="820" width="720" height="400" rx="34" fill="#FFFFFF" stroke="#EDE6D8" stroke-width="2"/>
  </g>
  <text x="156" y="868" class="sans card-label">Option 3</text>
  <text x="156" y="920" class="serif card-title">Metric Strip</text>
  <rect x="156" y="980" width="648" height="138" rx="69" fill="#FFFDF7" stroke="#E8E1D3" stroke-width="2"/>
  <line x1="318" y1="1010" x2="318" y2="1088" class="line"/>
  <line x1="480" y1="1010" x2="480" y2="1088" class="line"/>
  <line x1="642" y1="1010" x2="642" y2="1088" class="line"/>
  <text x="184" y="1036" class="sans small-strong">48 hours</text>
  <text x="184" y="1074" class="sans tiny">to launch</text>
  <text x="346" y="1036" class="sans small-strong">No hardware</text>
  <text x="346" y="1074" class="sans tiny">required</text>
  <text x="508" y="1036" class="sans small-strong">Audit logs</text>
  <text x="508" y="1074" class="sans tiny">built in</text>
  <text x="670" y="1036" class="sans small-strong">AI descriptions</text>
  <text x="670" y="1074" class="sans tiny">at scale</text>
  <text x="156" y="1174" class="sans small">Best for credibility, proof, and investor-friendly messaging.</text>

