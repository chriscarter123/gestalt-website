  <g filter="url(#shadow)">
    <rect x="960" y="260" width="720" height="500" rx="34" fill="#FFFFFF" stroke="#EDE6D8" stroke-width="2"/>
  </g>
  <text x="996" y="308" class="sans card-label">Option 2</text>
  <text x="996" y="360" class="serif card-title">Audience Split</text>
